name: Feature request
description: Suggest an idea or enhancement for Lapse
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Feature idea
      description: What would you like Lapse to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      description: How does this help you or other gamers?
    validations:
      required: false
