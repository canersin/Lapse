id: com.canersin.Lapse
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: Lapse
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lapse/cargo
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --filesystem=home
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --device=dri
modules:
  - name: lapse
    buildsystem: simple
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/Lapse /app/bin/Lapse
      - install -Dm644 assets/lapse.desktop /app/share/applications/com.canersin.Lapse.desktop
      - install -Dm644 assets/icon.png /app/share/pixmaps/com.canersin.Lapse.png
    sources:
      - type: dir
        path: .