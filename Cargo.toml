[package]
name = "lapse"
version = "0.1.1"
edition = "2024"
authors = ["Ersin Can Karaca <canersinkaraca@gmail.com>"]
description = "Modern and lightweight game clipper for Linux"
license = "GPL-3.0-only"
repository = "https://github.com/canersin/lapse"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
global-hotkey = "0.5" 
eframe = "0.26" 
anyhow = "1.0"
directories = "5.0"
signal-hook = "0.3" 
notify-rust = "4.12.0"
rfd = "0.17.2"
rodio = "0.22.2"
tray-icon = "0.19.0"
muda = "0.15.2" # For tray menu
image = "0.24"
gtk = "0.18"
chrono = "0.4.38"
open = "5.1"
egui_extras = { version = "0.26", features = ["all_loaders"] }

[package.metadata.deb]
maintainer = "Ersin Can Karaca <canersinkaraca@gmail.com>"
copyright = "2026, Ersin Can Karaca"
license-file = ["LICENSE", "0"]
depends = "$auto, gtk3, libwayland-client0, libappindicator3-1"
assets = [
    ["target/release/lapse", "usr/bin/lapse", "755"],
    ["assets/lapse.desktop", "usr/share/applications/lapse.desktop", "644"],
    ["assets/icon.png", "usr/share/pixmaps/lapse.png", "644"],
    ["assets/shutter.ogg", "usr/share/sounds/lapse/shutter.ogg", "644"],
]
[package.metadata.appimage]
assets = ["assets/icon.png", "assets/shutter.ogg", "assets/lapse.desktop"]
icon = "assets/icon.png"